# =============================================================
# ci.yml — GitHub Actions CI/CD Pipeline
# =============================================================
# This file runs automatically every time you push code
# to the 'main' or 'develop' branch on GitHub.
# It does 2 jobs in order:
#   Job 1: test  — checks your code is correct
#   Job 2: build — builds Docker image if tests pass
# =============================================================

name: CI Pipeline

# WHEN to run this pipeline
on:
  push:
    branches:
      - main       # runs when you push to main
      - develop    # runs when you push to develop
  pull_request:
    branches:
      - main       # runs when you open a pull request to main

# WHAT to do when it runs
jobs:

  # ── JOB 1: TEST ──────────────────────────────────────────
  # Runs your tests and checks code style
  test:
    runs-on: ubuntu-latest  # runs on a fresh Linux machine on GitHub

    steps:

      # Step 1 — Download your code onto the GitHub machine
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Install Python 3.11 on the GitHub machine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3 — Install all your Python libraries
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Step 4 — Check code style with flake8
      # flake8 checks for common Python mistakes and bad formatting
      # Example: line too long, unused imports, wrong spacing
      - name: Lint with flake8
        run: flake8 src/ --max-line-length=120 --ignore=E501,W503

      # Step 5 — Check code formatting with black
      # black checks that your code is formatted consistently
      # Example: correct indentation, spacing around operators
      - name: Check formatting with black
        run: black --check src/

      # Step 6 — Run all your tests with pytest
      - name: Run tests
        run: pytest tests/ -v

  # ── JOB 2: BUILD ─────────────────────────────────────────
  # Builds Docker image only if Job 1 (test) passes
  build:
    runs-on: ubuntu-latest
    needs: test   # ← only runs if 'test' job passed

    steps:

      # Step 1 — Download your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Log in to GitHub Container Registry (GHCR)
      # GHCR is where your Docker image gets stored
      # GHCR_TOKEN is a secret you add to GitHub repo settings
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Step 3 — Build the Docker image and push to GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/ikteaja/healthcare-workforce-ai:latest